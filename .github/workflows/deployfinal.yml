# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Despliegue de Hola mundo

on:
  push:
    branches: "19-11"

permissions:
    contents: read
    packages: write
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./finalquintob
        push: true
        tags: ghcr.io/padme2003/salchi:2.0.0
        
    - name: 📦 Copiar stack.yml al VPS (SCP)
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "finalquintob/stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/finalquintob"

    - name: 🚀 Deploy con eliminación del stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd ~/finalquintob

          # Login a GitHub Container Registry
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u padme2003 --password-stdin

          # Descargar la nueva imagen
          docker pull ghcr.io/padme2003/salchi:2.0.0

          # Borrar el stack SIEMPRE (si no existe no falla)
          docker stack rm quintob || true

          # Pequeña espera mientras Swarm libera recursos
          sleep 10

          # Crear el nuevo stack limpio
          docker stack deploy --with-registry-auth -c stack.yml quintob

          # Estado final del despliegue
          docker service ls
          docker stack ps quintob